name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate manifest.json
        run: python3 -c "import json; json.load(open('manifest.json'))"

      - name: Syntax-check every script
        run: |
          for f in $(find src tests -name "*.js"); do
            node --check "$f"
          done

      - name: Run tests
        run: node tests/test_prompt_template.js
