<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font: 13px/1.5 system-ui, sans-serif; margin: 0; padding: 12px;
        background: #1e1e2e; color: #cdd6f4; }
      h1 { font-size: 14px; margin: 0 0 4px; }
      .hint { color: #888; margin: 0 0 12px; }
      label.toggle { display: flex; align-items: center; gap: 6px; margin: 10px 0; cursor: pointer; }
      a { color: #89b4fa; }
      hr { border: none; border-top: 1px solid #313244; margin: 12px 0; }
      #empty { color: #888; }
      .entry { background: #313244; border-radius: 8px; padding: 10px; margin-bottom: 10px; }
      .entry .question { font-weight: 600; color: #94e2d5; margin: 0 0 6px; white-space: pre-wrap; }
      .entry p { white-space: pre-wrap; margin: 0 0 8px; }
      .entry .answer { display: none; background: #1e1e2e; border-radius: 6px; padding: 8px; margin-top: 6px; }
      .entry .answer.revealed { display: block; }
      .entry button { cursor: pointer; background: #89b4fa; color: #1e1e2e; border: none;
        border-radius: 6px; padding: 5px 9px; font-size: 12px; font-weight: 600; }
      .entry .err { color: #f38ba8; }
      #auto-error { display: none; color: #f38ba8; margin: 0 0 10px; }
    </style>
  </head>
  <body>
    <h1>Delphi</h1>
    <p class="hint">Select text → right-click → "Explain with Delphi", or drag-capture a region. Answers for the active tab collect below.</p>

    <label class="toggle"><input type="checkbox" id="auto-toggle" /> Auto-detect questions on this tab</label>
    <p id="auto-error"></p>
    <a href="#" id="open-options">Settings</a>

    <hr />

    <div id="empty">No answers yet on this tab.</div>
    <div id="history"></div>

    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
