<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Delphi settings</title>
    <style>
      :root { accent-color: #89b4fa; }
      body { font: 14px/1.6 system-ui, sans-serif; max-width: 480px; margin: 32px auto; padding: 0 16px;
        background: #1e1e2e; color: #cdd6f4; }
      h1 { display: flex; align-items: center; gap: 10px; font-size: 18px; margin: 0 0 20px; }
      h1 .mark { width: 26px; height: 26px; border-radius: 6px; background: #1e1e2e; flex: none; }
      fieldset { border: none; background: #313244; border-radius: 10px; padding: 14px 16px; margin: 0 0 16px; }
      legend { color: #94e2d5; font-weight: 600; font-size: 13px; padding: 0 4px; }
      label { display: block; margin: 8px 0; }
      label > input[type="text"], label > input[type="password"] { display: block; margin-top: 4px; }
      input[type="text"], input[type="password"] { width: 100%; box-sizing: border-box; padding: 6px 8px;
        background: #1e1e2e; color: #cdd6f4; border: 1px solid #45475a; border-radius: 6px; font: inherit; }
      input[type="text"]:focus, input[type="password"]:focus { outline: none; border-color: #89b4fa; }
      #save { cursor: pointer; background: #89b4fa; color: #1e1e2e; border: none; border-radius: 6px;
        padding: 8px 16px; font-size: 13px; font-weight: 600; }
      #save:hover { background: #a6c6fb; }
      #status { color: #a6e3a1; margin-left: 8px; }
    </style>
  </head>
  <body>
    <h1><svg class="mark" viewBox="0 0 128 128"><rect width="128" height="128" rx="26" fill="#1e1e2e"/><path d="M64 26 L104 96 L24 96 Z" fill="#89b4fa"/></svg> Delphi settings</h1>

    <fieldset>
      <legend>Answer mode</legend>
      <label><input type="radio" name="mode" value="explain" /> Explain first, reveal answer on click (recommended for learning)</label>
      <label><input type="radio" name="mode" value="answer_only" /> Answer only (quick self-check)</label>
    </fieldset>

    <fieldset>
      <legend>LLM provider</legend>
      <label><input type="radio" name="providerId" value="chrome-ai" /> Chrome built-in AI (Gemini Nano, on-device, free, no setup)</label>
      <label><input type="radio" name="providerId" value="ollama" /> Ollama (local)</label>
      <div id="ollama-config" style="margin-left: 22px;">
        <label>Base URL <input type="text" id="ollama-baseUrl" placeholder="http://localhost:11434" /></label>
        <label>Text model <input type="text" id="ollama-model" placeholder="llama3.2" /></label>
        <label>Vision model (for region capture / check this page) <input type="text" id="ollama-visionModel" placeholder="llava" /></label>
      </div>
      <label><input type="radio" name="providerId" value="custom" /> Custom API (OpenAI-compatible)</label>
      <div id="custom-config" style="margin-left: 22px;">
        <label>Base URL <input type="text" id="custom-baseUrl" placeholder="https://api.openai.com/v1" /></label>
        <label>API key <input type="password" id="custom-apiKey" /></label>
        <label>Model <input type="text" id="custom-model" placeholder="gpt-4o-mini" /></label>
      </div>
    </fieldset>

    <button id="save">Save</button>
    <span id="status"></span>

    <script src="options.js"></script>
  </body>
</html>
