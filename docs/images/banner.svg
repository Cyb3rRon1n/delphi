<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="300" fill="#14161a"/>

  <!-- rack-shelf texture, matching the sibling banners -->
  <g stroke="#ffffff" stroke-opacity="0.035" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="110" x2="1200" y2="110"/>
    <line x1="0" y1="190" x2="1200" y2="190"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
  </g>

  <defs>
    <linearGradient id="tri" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#89b4fa"/>
      <stop offset="100%" stop-color="#94e2d5"/>
    </linearGradient>
  </defs>

  <!-- delta mark -->
  <g transform="translate(38,34.5) scale(3.5)">
    <path fill="url(#tri)" d="M32 8 L54 52 L10 52 Z"/>
  </g>

  <!-- wordmark -->
  <text x="280" y="160" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="72" font-weight="700" letter-spacing="6" fill="#f0f2f5">DELPHI</text>
  <text x="282" y="196" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="22" fill="#9aa1ab">A self-study explainer that reads the page with you</text>

  <!-- multiple-choice motif: three answer bars, the right one picked -->
  <g>
    <rect x="1002" y="228" width="72" height="14" rx="7" fill="#3a3f47" opacity="0.5"/>
    <rect x="1002" y="248" width="72" height="14" rx="7" fill="#89b4fa"/>
    <rect x="1002" y="268" width="72" height="14" rx="7" fill="#3a3f47" opacity="0.5"/>
    <path d="M1084 251 l4 4 8-8" stroke="#94e2d5" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
